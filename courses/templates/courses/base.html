<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary: #3d2b1f; /* Espresso */
            --primary-light: #5d4637;
            --secondary: #c68642; /* Caramel */
            --accent: #d4af37; /* Gold */
            --bg-page: #fdfaf7; /* Latte Cream */
            --glass: rgba(253, 250, 247, 0.85);
            --text-dark: #2d1e14;
            --text-muted: #7d6e63;
            --shadow-soft: 0 10px 40px rgba(61, 43, 31, 0.08);
            --border-glass: rgba(198, 134, 66, 0.15);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            margin: 0;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(198, 134, 66, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 0%, rgba(61, 43, 31, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Floating Navbar */
        .navbar {
            background: var(--glass) !important;
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            margin: 20px auto;
            width: 90%;
            max-width: 1200px;
            padding: 1rem 2rem;
            box-shadow: var(--shadow-soft);
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--text-dark) !important;
            letter-spacing: -0.5px;
        }

        .navbar-brand i {
            color: var(--secondary);
        }

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: var(--secondary) !important;
        }

        /* Crystal Cards */
        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            border-radius: 32px;
            box-shadow: var(--shadow-soft);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 10px;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgba(61, 43, 31, 0.12);
            border-color: var(--secondary);
        }

        /* Soft Gradient Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border: none;
            border-radius: 16px;
            padding: 14px 32px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(61, 43, 31, 0.15);
            transition: all 0.3s ease;
            color: #ffffff !important;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(61, 43, 31, 0.25);
            filter: brightness(1.1);
        }

        .btn-outline-primary {
            border: 2px solid var(--secondary);
            color: var(--secondary);
            border-radius: 16px;
            padding: 12px 28px;
            font-weight: 700;
            background: transparent;
        }

        .btn-outline-primary:hover {
            background: var(--secondary);
            color: white !important;
            box-shadow: 0 10px 20px rgba(198, 134, 66, 0.1);
        }

        /* Typography */
        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -1px;
        }

        .text-gradient {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: rgba(198, 134, 66, 0.1) !important;
            color: var(--secondary) !important;
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 700;
        }

        /* Inputs */
        .form-control {
            background: rgba(61, 43, 31, 0.03);
            border: 1px solid rgba(61, 43, 31, 0.1);
            border-radius: 16px;
            padding: 14px 20px;
            color: var(--text-dark);
        }

        .form-control:focus {
            background: white;
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(198, 134, 66, 0.1);
        }

        /* Animations */
        @keyframes subtleFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: subtleFloat 5s ease-in-out infinite;
        }

        /* Visibility Fixes */
        h1, h2, h3, h4, h5, h6, p, span, div, li, td, th {
            color: var(--text-dark);
        }

        label {
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .text-muted { color: var(--text-muted) !important; }
        .bg-primary { background-color: var(--primary) !important; }
        .bg-secondary { background-color: var(--secondary) !important; }
        
        .bg-primary.bg-opacity-10 {
            background-color: rgba(61, 43, 31, 0.1) !important;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
        <i class="fas fa-layer-group me-2 fs-3"></i>
        <span>Lumina<span>Hub</span></span>
    </a>
    <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <i class="fas fa-bars-staggered"></i>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        {% if user.is_authenticated %}
            <li class="nav-item">
                <a class="nav-link px-3" href="{% url 'dashboard' %}">Catalog</a>
            </li>
            <li class="nav-item">
                <div class="bg-primary bg-opacity-10 text-primary rounded-pill px-4 py-2 small fw-bold ms-2">
                    Hello, {{ user.username }}
                </div>
            </li>
            <li class="nav-item">
                <a class="nav-link text-danger ms-lg-2" href="{% url 'logout' %}">Sign Out</a>
            </li>
        {% else %}
            <li class="nav-item">
                <a class="nav-link px-3" href="{% url 'login' %}">Login</a>
            </li>
            <li class="nav-item">
                <a class="nav-link btn btn-primary text-white ms-lg-3 px-4 rounded-pill" href="{% url 'register' %}">Get Started</a>
            </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid px-md-5 py-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
