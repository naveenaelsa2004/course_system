{% extends 'courses/base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 p-md-5 border-0 shadow-lg">
            <div class="text-center mb-5">
                <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex p-4 mb-4">
                    <i class="fas fa-user-shield text-primary fa-2x"></i>
                </div>
                <h2 class="fw-bold mb-2">Welcome Back</h2>
                <p class="text-muted small">Enter your details to access your account</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3">Sign In</button>
            </form>
            
            <div class="mt-5 text-center">
                <p class="text-muted small mb-2">Don't have an account?</p>
                <a href="{% url 'register' %}" class="text-primary text-decoration-none fw-bold">Create Account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
