{% extends 'courses/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card p-4 border-danger shadow-sm text-center">
            <div class="text-danger mb-4">
                <i class="fas fa-exclamation-triangle fa-4x"></i>
            </div>
            <h3 class="fw-bold">Delete Course?</h3>
            <p class="fs-5">Are you sure you want to delete the course <strong>"{{ course.title }}"</strong>?</p>
            <p class="text-muted">This action cannot be undone and all enrollments will be lost.</p>
            
            <form method="post" class="mt-4">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4"><i class="fas fa-trash-alt me-2"></i>Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
