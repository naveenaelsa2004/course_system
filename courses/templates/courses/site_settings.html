{% extends 'courses/base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6">
        <div class="card border-0 shadow-lg">
            <div class="p-4 p-md-5">
                <div class="text-center mb-5">
                    <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex p-4 mb-4">
                        <i class="fas fa-cog text-primary fa-2x"></i>
                    </div>
                    <h2 class="fw-bold">Platform Settings</h2>
                    <p class="text-muted">Manage global configuration and security</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">SITE NAME</label>
                        <input type="text" name="site_name" class="form-control" value="{{ setting.site_name }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">CONTACT EMAIL</label>
                        <input type="email" name="contact_email" class="form-control" value="{{ setting.contact_email }}" required>
                    </div>
                    <div class="mb-5 p-4 rounded-4 bg-light">
                        <div class="form-check form-switch d-flex align-items-center justify-content-between p-0">
                            <div>
                                <label class="form-check-label fw-bold mb-1" for="maintenanceMode">Maintenance Mode</label>
                                <div class="text-muted small">Disable public access to the platform</div>
                            </div>
                            <input class="form-check-input ms-0" type="checkbox" name="maintenance_mode" id="maintenanceMode" {% if setting.maintenance_mode %}checked{% endif %} style="width: 3rem; height: 1.5rem; cursor: pointer;">
                        </div>
                    </div>
                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-primary flex-grow-1 py-3">Save Configuration</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-light px-4 py-3">Discard</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
